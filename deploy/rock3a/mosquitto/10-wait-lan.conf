# labems-hlj (B1), Codex-reviewed v3: robust mosquitto bind-on-boot for the WiFi-only Rock.
# Takes effect on the NEXT mosquitto start (drop-in + daemon-reload only; no restart now).
[Service]
# ExecStartPre may wait up to ~60s for the listener addresses; give startup headroom.
# (Type=notify counts the pre-start against TimeoutStartSec; default 90s is tight.)
# NOTE: TimeoutStartSec is a [Service] directive — it is IGNORED if placed under [Unit].
TimeoutStartSec=120
ExecStartPre=/usr/local/sbin/wait-for-mqtt-lan-addr.sh
RestartSec=2
# Deliberately NOT disabling the start-limit: with the wait, the .22/Tailscale-slow case no
# longer rapid-fails, so the default start-limit still correctly gives up and surfaces a
# GENUINE config/ACL/port error instead of retrying forever.
